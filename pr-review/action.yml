name: 'AI Code Review'
description: 'Uses OpenAI to review pull requests and suggest improvements'
author: 'niko0xdev'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  openai-api-key:
    description: 'OpenAI API key for code review'
    required: true
  openai-base-url:
    description: 'Custom OpenAI API base URL (optional)'
    required: false
  openai-model:
    description: 'OpenAI model to use for review'
    required: false
    default: 'gpt-4'
  review-prompt:
    description: 'Custom prompt for OpenAI review'
    required: false
    default: 'Focus on correctness, code quality, security, performance, test coverage, and best practices. Provide actionable, line-specific feedback whenever possible.'
  max-files:
    description: 'Maximum number of files to review'
    required: false
    default: '10'
  exclude-patterns:
    description: 'Comma-separated list of file patterns to exclude from review'
    required: false
    default: '*.md,*.txt,*.json,*.yml,*.yaml'
  include-dir:
    description: 'Comma-separated list of directory paths to include in review. Only files in these directories will be reviewed.'
    required: false
  auto-approve-when-resolved:
    description: 'If true, approve the pull request when all AI-generated review threads are resolved'
    required: false
    default: 'false'
  min-severity:
    description: 'Minimum severity level for comments (low, high, critical)'
    required: false
    default: 'critical'
  block-on-issues:
    description: 'If true, block PR merge when issues at or above min-severity are found'
    required: false
    default: 'true'
  include-full-content:
    description: 'Include full source code content and import dependencies in review (better context, higher cost)'
    required: false
    default: 'false'
  max-context-chars:
    description: 'Global character limit for all context content combined (prevents exceeding LLM context window)'
    required: false
    default: '30000'
  mode:
    description: 'Review mode (only "review" is supported; unknown values fall back to "review")'
    required: false
    default: 'review'
  require-write-permissions:
    description: 'When true, skip APPROVE/REQUEST_CHANGES escalation if the PR actor lacks write permission (still posts review)'
    required: false
    default: 'false'
  buffer-inline-comments:
    description: 'Buffer inline findings to /tmp/ai-inline-buffer.jsonl and classify before posting (confirmed=false never posts)'
    required: false
    default: 'true'
  classify-inline-comments:
    description: 'Alias for buffer-inline-comments (CCA compat)'
    required: false
    default: 'true'
  allowed-bots:
    description: 'Comma-separated allowed bot usernames, or * to allow all (empty denies bots; mirrors CCA allowed_bots)'
    required: false
    default: ''
  exclude-actors:
    description: 'Comma-separated actor usernames/patterns to exclude (supports *[bot] wildcard)'
    required: false
    default: ''
  sticky-summary:
    description: 'Reuse a single summary comment per PR (update on re-runs instead of re-posting)'
    required: false
    default: 'true'
  track-progress:
    description: 'Emit $GITHUB_STEP_SUMMARY updates as the review walks phases (CCA track_progress analog)'
    required: false
    default: 'false'
  review-prompt-file:
    description: 'Path to a repo-relative file whose contents are prepended to the review prompt'
    required: false
    default: ''

outputs:
  review-summary:
    description: 'Summary of the code review'
    value: ${{ steps.run-review.outputs.review-summary }}

runs:
  using: composite
  steps:
    - name: Install Pi coding agent
      shell: bash
      run: |
        if ! command -v pi >/dev/null 2>&1 || ! pi --version 2>/dev/null | grep -q '^0.73.1'; then
          npm install -g @mariozechner/pi-coding-agent@0.73.1 --no-audit --no-fund --ignore-scripts --silent
        fi
    - name: Run AI Code Review
      id: run-review
      shell: bash
      run: node ${{ github.action_path }}/dist/index.js
      env:
        # @actions/core getInput reads INPUT_<NAME> with only
        # spaces replaced by underscores; hyphens are preserved.
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_OPENAI-API-KEY: ${{ inputs.openai-api-key }}
        INPUT_OPENAI-BASE-URL: ${{ inputs.openai-base-url }}
        INPUT_OPENAI-MODEL: ${{ inputs.openai-model }}
        INPUT_REVIEW-PROMPT: ${{ inputs.review-prompt }}
        INPUT_MAX-FILES: ${{ inputs.max-files }}
        INPUT_EXCLUDE-PATTERNS: ${{ inputs.exclude-patterns }}
        INPUT_INCLUDE-DIR: ${{ inputs.include-dir }}
        INPUT_AUTO-APPROVE-WHEN-RESOLVED: ${{ inputs.auto-approve-when-resolved }}
        INPUT_MIN-SEVERITY: ${{ inputs.min-severity }}
        INPUT_BLOCK-ON-ISSUES: ${{ inputs.block-on-issues }}
        INPUT_INCLUDE-FULL-CONTENT: ${{ inputs.include-full-content }}
        INPUT_MAX-CONTEXT-CHARS: ${{ inputs.max-context-chars }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REQUIRE-WRITE-PERMISSIONS: ${{ inputs.require-write-permissions }}
        INPUT_BUFFER-INLINE-COMMENTS: ${{ inputs.buffer-inline-comments }}
        INPUT_CLASSIFY-INLINE-COMMENTS: ${{ inputs.classify-inline-comments }}
        INPUT_ALLOWED-BOTS: ${{ inputs.allowed-bots }}
        INPUT_EXCLUDE-ACTORS: ${{ inputs.exclude-actors }}
        INPUT_STICKY-SUMMARY: ${{ inputs.sticky-summary }}
        INPUT_TRACK-PROGRESS: ${{ inputs.track-progress }}
        INPUT_REVIEW-PROMPT-FILE: ${{ inputs.review-prompt-file }}
