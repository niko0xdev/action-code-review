name: 'AI Code Review'
description: 'Uses OpenAI to review pull requests and suggest improvements'
author: 'niko0xdev'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  openai-api-key:
    description: 'OpenAI API key for code review'
    required: true
  openai-base-url:
    description: 'Custom OpenAI API base URL (optional)'
    required: false
  openai-model:
    description: 'OpenAI model to use for review'
    required: false
    default: 'gpt-4'
  review-prompt:
    description: 'Custom prompt for OpenAI review'
    required: false
    default: 'Focus on correctness, code quality, security, performance, test coverage, and best practices. Provide actionable, line-specific feedback whenever possible.'
  max-files:
    description: 'Maximum number of files to review'
    required: false
    default: '10'
  exclude-patterns:
    description: 'Comma-separated list of file patterns to exclude from review'
    required: false
    default: '*.md,*.txt,*.json,*.yml,*.yaml'
  include-dir:
    description: 'Comma-separated list of directory paths to include in review. Only files in these directories will be reviewed.'
    required: false
  auto-approve-when-resolved:
    description: 'If true, approve the pull request when all AI-generated review threads are resolved'
    required: false
    default: 'false'
  min-severity:
    description: 'Minimum severity level for comments (low, high, critical)'
    required: false
    default: 'critical'
  block-on-issues:
    description: 'If true, block PR merge when issues at or above min-severity are found'
    required: false
    default: 'true'
  include-full-content:
    description: 'Include full source code content and import dependencies in review (better context, higher cost)'
    required: false
    default: 'false'
  max-context-chars:
    description: 'Global character limit for all context content combined (prevents exceeding LLM context window)'
    required: false
    default: '30000'

outputs:
  review-summary:
    description: 'Summary of the code review'

runs:
  using: composite
  steps:
    - name: Install Pi coding agent
      shell: bash
      run: |
        if ! command -v pi >/dev/null 2>&1; then
          npm install -g @mariozechner/pi-coding-agent@0.73.1 --no-audit --no-fund --silent
        fi
    - name: Run AI Code Review
      shell: bash
      run: node ${{ github.action_path }}/dist/index.js
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
        INPUT_OPENAI_MODEL: ${{ inputs.openai-model }}
        INPUT_REVIEW_PROMPT: ${{ inputs.review-prompt }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
        INPUT_INCLUDE_DIR: ${{ inputs.include-dir }}
        INPUT_AUTO_APPROVE_WHEN_RESOLVED: ${{ inputs.auto-approve-when-resolved }}
        INPUT_MIN_SEVERITY: ${{ inputs.min-severity }}
        INPUT_BLOCK_ON_ISSUES: ${{ inputs.block-on-issues }}
        INPUT_INCLUDE_FULL_CONTENT: ${{ inputs.include-full-content }}
        INPUT_MAX_CONTEXT_CHARS: ${{ inputs.max-context-chars }}
