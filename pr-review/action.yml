name: 'AI Code Review'
description: 'Uses OpenAI to review pull requests and suggest improvements'
author: 'niko0xdev'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  openai-api-key:
    description: 'OpenAI API key for code review'
    required: true
  openai-base-url:
    description: 'Custom OpenAI API base URL (optional)'
    required: false
  openai-model:
    description: 'OpenAI model to use for review'
    required: false
    default: 'gpt-4'
  review-prompt:
    description: 'Custom prompt for OpenAI review'
    required: false
    default: 'Focus on correctness, code quality, security, performance, test coverage, and best practices. Provide actionable, line-specific feedback whenever possible.'
  max-files:
    description: 'Maximum number of files to review'
    required: false
    default: '10'
  exclude-patterns:
    description: 'Comma-separated list of file patterns to exclude from review'
    required: false
    default: '*.md,*.txt,*.json,*.yml,*.yaml'
  include-dir:
    description: 'Comma-separated list of directory paths to include in review. Only files in these directories will be reviewed.'
    required: false
  auto-approve-when-resolved:
    description: 'If true, approve the pull request when all AI-generated review threads are resolved'
    required: false
    default: 'false'
  min-severity:
    description: 'Minimum severity level for comments (low, high, critical)'
    required: false
    default: 'critical'
  block-on-issues:
    description: 'If true, block PR merge when issues at or above min-severity are found'
    required: false
    default: 'true'
  include-full-content:
    description: 'Include full source code content and import dependencies in review (better context, higher cost)'
    required: false
    default: 'false'
  max-context-chars:
    description: 'Global character limit for all context content combined (prevents exceeding LLM context window)'
    required: false
    default: '30000'
  mode:
    description: 'Execution mode: auto | review | security | agent'
    required: false
    default: 'auto'
  security-profile:
    description: 'Security profile: diff | lite | balanced | deep | confirm'
    required: false
    default: 'diff'
  security-min-severity:
    description: 'Minimum severity to publish: critical | high | medium | low | info'
    required: false
    default: 'medium'
  security-fail-on:
    description: 'Fail the action when a finding reaches this severity'
    required: false
    default: 'critical'
  security-confirm-findings:
    description: 'Run validation/confirmation for eligible findings'
    required: false
    default: 'true'
  security-inline-comments:
    description: 'Publish validated findings as inline PR comments when possible'
    required: false
    default: 'true'
  security-sticky-comment:
    description: 'Publish/update a single security summary comment'
    required: false
    default: 'true'
  security-sarif:
    description: 'Generate SARIF output'
    required: false
    default: 'true'
  security-max-findings:
    description: 'Maximum number of findings to publish to the PR'
    required: false
    default: '20'
  security-risk-threshold:
    description: 'Risk threshold for escalating to deeper security analysis'
    required: false
    default: 'high'
  require-write-permissions:
    description: 'When true, skip APPROVE/REQUEST_CHANGES escalation if the PR actor lacks write permission (still posts review)'
    required: false
    default: 'false'
  buffer-inline-comments:
    description: 'Buffer inline findings to /tmp/ai-inline-buffer.jsonl and classify before posting (confirmed=false never posts)'
    required: false
    default: 'true'
  classify-inline-comments:
    description: 'Alias for buffer-inline-comments (CCA compat)'
    required: false
    default: 'true'
  allowed-bots:
    description: 'Comma-separated allowed bot usernames, or * to allow all (empty denies bots; mirrors CCA allowed_bots)'
    required: false
    default: ''
  exclude-actors:
    description: 'Comma-separated actor usernames/patterns to exclude (supports *[bot] wildcard)'
    required: false
    default: ''
  sticky-summary:
    description: 'Reuse a single summary comment per PR (update on re-runs instead of re-posting)'
    required: false
    default: 'true'
  track-progress:
    description: 'Emit $GITHUB_STEP_SUMMARY updates as the review walks phases (CCA track_progress analog)'
    required: false
    default: 'false'
  review-prompt-file:
    description: 'Path to a repo-relative file whose contents are prepended to the review prompt'
    required: false
    default: ''
  pi-args:
    description: 'Extra Pi CLI flags (whitelisted: --max-duration/--model-override/--no-session)'
    required: false
    default: ''
  pi-binary-path:
    description: 'Path to custom Pi binary (skip auto-install when set and executable; falls back with warning)'
    required: false
    default: ''

outputs:
  review-summary:
    description: 'Summary of the code review'
    value: ${{ steps.run-review.outputs.review-summary }}
  security_findings:
    description: 'Validated security findings as JSON array'
    value: ${{ steps.run-review.outputs.security_findings }}
  security_findings_count:
    description: 'Count of validated security findings'
    value: ${{ steps.run-review.outputs.security_findings_count }}
  security_risk:
    description: 'Overall security risk level'
    value: ${{ steps.run-review.outputs.security_risk }}
  security_sarif_path:
    description: 'Filesystem path to generated SARIF report'
    value: ${{ steps.run-review.outputs.security_sarif_path }}
  security_report_path:
    description: 'Filesystem path to generated audit report'
    value: ${{ steps.run-review.outputs.security_report_path }}
  security_conclusion:
    description: 'JSON-encoded security conclusion with scanner metadata'
    value: ${{ steps.run-review.outputs.security_conclusion }}

runs:
  using: composite
  steps:
    - name: Setup harness loop
      if: inputs.pi-binary-path == ''
      shell: bash
      run: |
        if ! command -v pi >/dev/null 2>&1 || ! pi --version 2>/dev/null | grep -q '^0.73.1'; then
          npm install -g @mariozechner/pi-coding-agent@0.73.1 --no-audit --no-fund --ignore-scripts --silent
        fi
    - name: Run AI Code Review
      id: run-review
      shell: bash
      run: node ${{ github.action_path }}/dist/index.js
      env:
        # @actions/core getInput reads INPUT_<NAME> with only
        # spaces replaced by underscores; hyphens are preserved.
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_OPENAI-API-KEY: ${{ inputs.openai-api-key }}
        INPUT_OPENAI-BASE-URL: ${{ inputs.openai-base-url }}
        INPUT_OPENAI-MODEL: ${{ inputs.openai-model }}
        INPUT_REVIEW-PROMPT: ${{ inputs.review-prompt }}
        INPUT_MAX-FILES: ${{ inputs.max-files }}
        INPUT_EXCLUDE-PATTERNS: ${{ inputs.exclude-patterns }}
        INPUT_INCLUDE-DIR: ${{ inputs.include-dir }}
        INPUT_AUTO-APPROVE-WHEN-RESOLVED: ${{ inputs.auto-approve-when-resolved }}
        INPUT_MIN-SEVERITY: ${{ inputs.min-severity }}
        INPUT_BLOCK-ON-ISSUES: ${{ inputs.block-on-issues }}
        INPUT_INCLUDE-FULL-CONTENT: ${{ inputs.include-full-content }}
        INPUT_MAX-CONTEXT-CHARS: ${{ inputs.max-context-chars }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SECURITY-PROFILE: ${{ inputs.security-profile }}
        INPUT_SECURITY-MIN-SEVERITY: ${{ inputs.security-min-severity }}
        INPUT_SECURITY-FAIL-ON: ${{ inputs.security-fail-on }}
        INPUT_SECURITY-CONFIRM-FINDINGS: ${{ inputs.security-confirm-findings }}
        INPUT_SECURITY-INLINE-COMMENTS: ${{ inputs.security-inline-comments }}
        INPUT_SECURITY-STICKY-COMMENT: ${{ inputs.security-sticky-comment }}
        INPUT_SECURITY-SARIF: ${{ inputs.security-sarif }}
        INPUT_SECURITY-MAX-FINDINGS: ${{ inputs.security-max-findings }}
        INPUT_SECURITY-RISK-THRESHOLD: ${{ inputs.security-risk-threshold }}
        INPUT_REQUIRE-WRITE-PERMISSIONS: ${{ inputs.require-write-permissions }}
        INPUT_BUFFER-INLINE-COMMENTS: ${{ inputs.buffer-inline-comments }}
        INPUT_CLASSIFY-INLINE-COMMENTS: ${{ inputs.classify-inline-comments }}
        INPUT_ALLOWED-BOTS: ${{ inputs.allowed-bots }}
        INPUT_EXCLUDE-ACTORS: ${{ inputs.exclude-actors }}
        INPUT_STICKY-SUMMARY: ${{ inputs.sticky-summary }}
        INPUT_TRACK-PROGRESS: ${{ inputs.track-progress }}
        INPUT_REVIEW-PROMPT-FILE: ${{ inputs.review-prompt-file }}
        INPUT_PI-ARGS: ${{ inputs.pi-args }}
        INPUT_PI-BINARY-PATH: ${{ inputs.pi-binary-path }}
