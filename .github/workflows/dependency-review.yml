name: Dependency Review

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Opt-in: skipped unless the owner enables the dependency graph and sets the
    # repository variable DEPENDENCY_REVIEW_ENABLED to 'true'.
    if: ${{ vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never
