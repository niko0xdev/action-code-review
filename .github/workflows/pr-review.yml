name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    name: AI Code Review

    permissions:
      contents: read
      pull-requests: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run AI Code Review
        uses: ./pr-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-base-url: ${{ secrets.OPENAI_API_URL }}
          openai-model: ${{ secrets.OPENAI_API_MODEL }}
          exclude-patterns: "*.md,*.txt,*.json,*.yml,*.yaml"
          track-progress: 'true'
        env:
          AI_REVIEW_ENABLE_PRELINT: 'true'
          AI_REVIEW_SKIP_DRAFTS: 'true'
          AI_REVIEW_VERIFY_BUDGET_USD: '0.50'
          AI_REVIEW_VERIFY_PASS: 'true'
          AI_REVIEW_MIN_CONFIDENCE: '0.8'
