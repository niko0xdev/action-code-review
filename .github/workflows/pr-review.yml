name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    name: AI Code Review
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install offline inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep fd-find
          rg --version
          fdfind --version

      - name: Run AI Code Review
        uses: ./pr-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-base-url: ${{ secrets.OPENAI_API_URL }}
          openai-model: ${{ secrets.OPENAI_API_MODEL }}
          exclude-patterns: "*.md,*.txt"
          track-progress: 'true'
          review-prompt: >-
            Focus on actionable correctness, security, and regression issues in the
            supplied patches. Use targeted source reads and searches rather than
            repeatedly listing the repository. Plan for at most 100 inspection
            calls within the 120-call hard ceiling. Report incomplete analysis
            honestly if the available evidence or budget is insufficient.
        env:
          # Large audit remediations need a bounded allowance above the default 60.
          AI_REVIEW_PI_MAX_TOOL_CALLS: '120'
          AI_REVIEW_ENABLE_PRELINT: 'true'
          AI_REVIEW_SKIP_DRAFTS: 'true'
          AI_REVIEW_VERIFY_BUDGET_USD: '0.50'
          AI_REVIEW_VERIFY_PASS: 'true'
          AI_REVIEW_MIN_CONFIDENCE: '0.8'
