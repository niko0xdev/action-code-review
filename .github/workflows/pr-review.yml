name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.number != 161
    runs-on: ubuntu-latest
    name: AI Code Review
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install offline inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep fd-find
          rg --version
          fdfind --version

      - name: Run AI Code Review
        uses: ./pr-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-base-url: ${{ secrets.OPENAI_API_URL }}
          openai-model: ${{ secrets.OPENAI_API_MODEL }}
          exclude-patterns: "*.md,*.txt"
          include-dir: 'src/data,tests/canary'
          track-progress: 'true'
          auto-approve-when-resolved: 'true'
          min-severity: 'high'
          max-context-chars: '150000'
          review-prompt: >-
            Review the selected tenant lookup adapter and its regression tests for
            actionable correctness, security, and regression issues. The injected
            query interface returns a caller-defined result. Inspect its declared
            contract and the supplied patches using targeted reads and searches.
            Report incomplete analysis honestly if the available evidence or budget
            is insufficient.
        env:
          # Large audit remediations need a bounded allowance above the default 60.
          AI_REVIEW_PI_MAX_TOOL_CALLS: '120'
          AI_REVIEW_ENABLE_PRELINT: 'true'
          AI_REVIEW_SKIP_DRAFTS: 'true'
          AI_REVIEW_VERIFY_BUDGET_USD: '0.50'
          AI_REVIEW_VERIFY_PASS: 'true'
          AI_REVIEW_MIN_CONFIDENCE: '0.8'

      - name: Verify live PR content generation
        if: github.event.pull_request.number == 161
        uses: ./pr-content
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-base-url: ${{ secrets.OPENAI_API_URL }}
          openai-model: ${{ secrets.OPENAI_API_MODEL }}
          max-tokens: '4096'
          custom-instructions: |
            Write in British English. The title must start with 'test:'.
            This PR is held for end-to-end verification and must not be merged.
            Include 'Do not merge – E2E verification only.' in the description.
            Include the exact marker ACR_E2E_CONTENT_20261118 in the description.
            Include this exact plain-text line without escaping dollar signs:
            Literal substitution probe: $& $$ $` $'
            Put that literal probe inside a fenced text block.
            Do not include a '## Description' heading in the JSON description.
            Do not mention providers or model names. Do not claim tests passed.

  controlled-publication:
    if: github.event.pull_request.number == 161
    name: Controlled publication E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Start controlled transport
        run: |
          node scripts/canary/provider.mjs > "$RUNNER_TEMP/acr-canary-provider.log" 2>&1 &
          echo "ACR_CANARY_PROVIDER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8317/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise actual approval publication through pinned runtime
        uses: ./pr-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: 'synthetic-canary-only'
          openai-base-url: 'http://127.0.0.1:8317/v1'
          openai-model: 'fixture'
          include-dir: 'src/data,tests/canary'
          min-severity: 'low'
          auto-approve-when-resolved: 'true'
          require-write-permissions: 'true'
          max-context-chars: '150000'
        env:
          AI_REVIEW_PI_TIMEOUT_MS: '60000'
          AI_REVIEW_VERIFY_PASS: 'true'
      - name: Stop controlled transport
        if: always()
        run: kill "$ACR_CANARY_PROVIDER_PID"
