name: 'AI PR Comment Reply'
description: 'Automatically replies to developer questions on PR review comments with AI assistance'
author: 'niko0xdev'
branding:
  icon: 'message'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  openai-api-key:
    description: 'OpenAI API key for generating replies'
    required: true
  openai-base-url:
    description: 'Custom OpenAI API base URL (optional)'
    required: false
  openai-model:
    description: 'OpenAI model to use for replies'
    required: false
    default: 'gpt-4'
  reply-prompt:
    description: 'Custom prompt for AI replies'
    required: false
    default: 'You are a helpful code review assistant answering developer questions about code review feedback. Be concise, direct, and practical.'
  enable-question-detection:
    description: 'If true, only reply to comments that appear to be questions'
    required: false
    default: 'true'
  include-full-content:
    description: 'Include full source code content in AI context (better context, higher cost)'
    required: false
    default: 'false'
  max-context-chars:
    description: 'Maximum character limit for file content context (prevents exceeding LLM context window)'
    required: false
    default: '10000'

outputs:
  reply-generated:
    description: 'Whether a reply was generated (true/false)'

runs:
  using: 'node20'
  main: 'dist/index.js'
