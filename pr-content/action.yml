name: 'Auto-update PR Content'
description: 'Automatically update pull request title and description using AI based on code changes'
author: 'AI Assistant'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  openai-api-key:
    description: 'OpenAI API key for generating content'
    required: true
  openai-base-url:
    description: 'Custom OpenAI API base URL (optional)'
    required: false
  openai-model:
    description: 'OpenAI model to use'
    required: false
    default: 'gpt-4'
  max-tokens:
    description: 'Maximum tokens for AI response'
    required: false
    default: '1000'
  include-file-list:
    description: 'Whether to include list of changed files in description'
    required: false
    default: 'true'
  custom-instructions:
    description: 'Additional instructions for content generation'
    required: false
    default: ''
  template-path:
    description: 'Path to pull request template file in the repository'
    required: false
    default: '.github/pull_request_template.md'

runs:
  using: composite
  steps:
    - name: Install Pi coding agent
      shell: bash
      run: |
        if ! command -v pi >/dev/null 2>&1; then
          npm install -g @mariozechner/pi-coding-agent@0.73.1 --no-audit --no-fund --silent
        fi
    - name: Run Auto-update PR Content
      shell: bash
      run: node ${{ github.action_path }}/dist/index.js
      env:
        # @actions/core getInput reads INPUT_<NAME> with only
        # spaces replaced by underscores; hyphens are preserved.
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_OPENAI-API-KEY: ${{ inputs.openai-api-key }}
        INPUT_OPENAI-BASE-URL: ${{ inputs.openai-base-url }}
        INPUT_OPENAI-MODEL: ${{ inputs.openai-model }}
        INPUT_MAX-TOKENS: ${{ inputs.max-tokens }}
        INPUT_INCLUDE-FILE-LIST: ${{ inputs.include-file-list }}
        INPUT_CUSTOM-INSTRUCTIONS: ${{ inputs.custom-instructions }}
        INPUT_TEMPLATE-PATH: ${{ inputs.template-path }}
